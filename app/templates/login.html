
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventSphere | Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000015;
        }
        h1 { text-align: center; color: #243b55; }
        p { text-align: center; color: #64748b; }
        label { display: block; margin-top: 18px; font-weight: bold; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #2457a6;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled { opacity: 0.6; }
        #loginMessage { color: #b91c1c; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>EventSphere</h1>
        <p>Event and Venue Booking Platform</p>
        <h2>Sign In</h2>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input type="email" id="email" required
                   placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" required
                   placeholder="Enter your password">

            <button type="submit" id="loginButton">Login</button>
        </form>

        <p id="loginMessage"></p>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
